<text transform="translate(195,142) scale(1,-1)" fill="#243746" font-family="sans-serif" font-size="4" font-weight="bold">Case datums and development access</text>
<text transform="translate(195,131) scale(1,-1)" fill="#243746" font-family="sans-serif" font-size="3.35">O = display center; Z0 = external rear surface; +Y = 12 o'clock lug.</text>
<text transform="translate(195,123) scale(1,-1)" fill="#243746" font-family="sans-serif" font-size="3.35">Three rear fasteners on R25 at 90, 235, 275 deg.</text>
<text transform="translate(195,115) scale(1,-1)" fill="#243746" font-family="sans-serif" font-size="3.35">Pilot D1.36 x 4.5; rear clearance D1.90; head recess D3.30 x 0.55.</text>
<text transform="translate(195,107) scale(1,-1)" fill="#243746" font-family="sans-serif" font-size="3.35">Candidate small polymer-thread screws; length/pullout not qualified.</text>
<text transform="translate(195,99) scale(1,-1)" fill="#243746" font-family="sans-serif" font-size="3.35">USB at 270 deg: 14 x 4.6 case opening, 23 x 14 x 7 plug keepout.</text>
<text transform="translate(195,91) scale(1,-1)" fill="#243746" font-family="sans-serif" font-size="3.35">Reset-tool opening at 250 deg, 2 x 2. Actual USB/reset positions TBD.</text>
<text transform="translate(195,83) scale(1,-1)" fill="#243746" font-family="sans-serif" font-size="3.35">Lugs: 20.0 clear width, 59.0 bar spacing, 64.0 tip span, D1.80 bores.</text>
<text transform="translate(195,75) scale(1,-1)" fill="#243746" font-family="sans-serif" font-size="3.35">Strap sizes, fit, pull strength and wrist clearance are prototype assumptions.</text>
<text transform="translate(195,67) scale(1,-1)" fill="#243746" font-family="sans-serif" font-size="3.35">Printed PA12 nominal +/-0.20 on dimensions; calibrate a coupon first.</text>
<text transform="translate(195,59) scale(1,-1)" fill="#243746" font-family="sans-serif" font-size="3.35">Dry bench prototype only. No water-resistance or final fastening claim.</text>
