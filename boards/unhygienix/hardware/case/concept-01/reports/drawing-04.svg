<text transform="translate(15,173) scale(1,-1)" fill="#243746" font-family="sans-serif" font-size="3">Actual section of housing, captured key and switch reservation.</text>
<text transform="translate(195,241) scale(1,-1)" fill="#243746" font-family="sans-serif" font-size="3.4">Rod 4.00 x 1.40 in 4.40 x 1.80 guide: 0.20 running gap per side.</text>
<text transform="translate(195,233) scale(1,-1)" fill="#243746" font-family="sans-serif" font-size="3.4">Inside flange 5.40 x 2.40 retained by aperture; radius trimmed to clear wall.</text>
<text transform="translate(195,225) scale(1,-1)" fill="#243746" font-family="sans-serif" font-size="3.4">Outside shoulder limits inward travel to 0.35 nominal.</text>
<text transform="translate(195,217) scale(1,-1)" fill="#243746" font-family="sans-serif" font-size="3.4">Rest rod-to-switch-tip gap 0.10. Assumed electrical travel 0.15:</text>
<text transform="translate(195,209) scale(1,-1)" fill="#243746" font-family="sans-serif" font-size="3.4">0.25 total to actuate, leaving 0.10 to hard stop. Actual switch TBD.</text>
<text transform="translate(195,201) scale(1,-1)" fill="#243746" font-family="sans-serif" font-size="3.4">Housing supplies retention/stop, selected switch must supply return force.</text>
<text transform="translate(195,193) scale(1,-1)" fill="#243746" font-family="sans-serif" font-size="3.4">Back/Select positions are proposals; engagement with stock switches unverified.</text>
<text transform="translate(195,185) scale(1,-1)" fill="#243746" font-family="sans-serif" font-size="3.4">Switch carrier, transfer geometry, seals and PCB routing are not released.</text>
